<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobMatch AI</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #18202b; --muted: #5d6877; --line: #e3e6eb;
    --accent: #2453d6; --accent-soft: #e8eefc; --good: #1f7a45; --good-soft: #e3f4ea;
    --miss: #8a5a12; --miss-soft: #fbf0dc; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 860px; margin: 0 auto; padding: 40px 20px 60px; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  header p { margin: 6px 0 0; color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin: 28px 0 14px; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 9px 16px; border-radius: 999px; font-size: 14px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text], textarea { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; color: var(--ink); }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #q { flex: 1 1 360px; }
  .loc { flex: 0 1 180px; }
  textarea { width: 100%; min-height: 140px; resize: vertical; margin-top: 10px; }
  button.go { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: wait; }
  .examples { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
  .examples button { font: inherit; font-size: 13px; border: 1px dashed var(--line); background: none; color: var(--accent); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .drop { display: block; border: 1.5px dashed #c3c9d3; border-radius: 10px; padding: 22px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { color: var(--ink); }
  .or { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  .status { margin: 18px 2px 10px; color: var(--muted); font-size: 14px; min-height: 20px; }
  .status.error { color: #b42318; }
  .found { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; font-size: 14px; }
  .results { display: grid; gap: 10px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
  .job h3 { margin: 0; font-size: 16px; }
  .meta { color: var(--muted); font-size: 14px; }
  .score { grid-row: span 2; text-align: right; min-width: 96px; }
  .score b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .score small { display: block; color: var(--muted); font-size: 12px; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #eef0f3; color: var(--muted); }
  .chip.has { background: var(--good-soft); color: var(--good); }
  .chip.miss { background: var(--miss-soft); color: var(--miss); }
  .legend { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  footer { margin-top: 36px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>JobMatch AI</h1>
    <p>Describe the work you want, or upload your resume. Jobs are matched by meaning, not just keywords.</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="search">Search jobs</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="resume">Match my resume</button>
  </div>

  <section class="panel" id="panel-search">
    <form id="search-form" class="row">
      <input type="text" id="q" placeholder="e.g. build ETL pipelines on the cloud" autocomplete="off" required minlength="2">
      <input type="text" id="loc-search" class="loc" placeholder="Location (optional)">
      <button class="go" type="submit">Search</button>
    </form>
    <div class="examples">Try:
      <button type="button" data-ex="build ETL pipelines on the cloud">build ETL pipelines on the cloud</button>
      <button type="button" data-ex="deploy deep learning models to production">deploy deep learning models</button>
      <button type="button" data-ex="turn business data into dashboards for stakeholders">dashboards for stakeholders</button>
    </div>
  </section>

  <section class="panel" id="panel-resume" hidden>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".pdf,.txt" hidden>
      <strong>Upload your resume</strong> (PDF or .txt)<br><span id="file-name">or drop it here</span>
    </label>
    <p class="or">or paste the text</p>
    <textarea id="resume-text" placeholder="Paste your resume here..."></textarea>
    <div class="row" style="margin-top:10px">
      <input type="text" id="loc-resume" class="loc" placeholder="Location (optional)">
      <button class="go" id="match-btn" type="button">Find matching jobs</button>
    </div>
  </section>

  <div class="status" id="status" role="status"></div>
  <div class="found" id="found" hidden></div>
  <p class="legend" id="legend" hidden><span class="chip has">skill you have</span> <span class="chip miss">skill you're missing</span></p>
  <div class="results" id="results"></div>

  <footer>
    <span id="health">Loading index...</span>
    <span><a href="/docs">API docs</a> · <a href="https://github.com/vikalpbharti/jobmatch-ai">GitHub</a></span>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let selectedFile = null;

// Tabs
document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t === tab));
  $("panel-search").hidden = tab.dataset.tab !== "search";
  $("panel-resume").hidden = tab.dataset.tab !== "resume";
  clearResults();
}));

function clearResults() {
  $("results").innerHTML = ""; $("found").hidden = true; $("legend").hidden = true; setStatus("");
}
function setStatus(msg, isError = false) {
  $("status").textContent = msg; $("status").classList.toggle("error", isError);
}

async function call(url, options) {
  const res = await fetch(url, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request failed (${res.status})`);
  return body;
}

function card(job, resumeMode) {
  const score = resumeMode ? job.final_score : job.score;
  const pct = Math.max(0, Math.min(100, Math.round(score * 100)));
  const sub = resumeMode
    ? `meaning ${Math.round(job.score * 100)}% · skills ${Math.round(job.skill_overlap * 100)}%`
    : "match score";
  const chips = resumeMode
    ? job.matched_skills.map((s) => `<span class="chip has">${esc(s)}</span>`).join("") +
      job.missing_skills.map((s) => `<span class="chip miss">${esc(s)}</span>`).join("")
    : job.skills.slice(0, 12).map((s) => `<span class="chip">${esc(s)}</span>`).join("");
  const meta = [job.company, job.location].filter(Boolean).map(esc).join(" · ");
  return `<article class="job">
    <h3>${esc(job.title)}</h3>
    <div class="score"><b>${pct}</b><small>${sub}</small><div class="bar"><span style="width:${pct}%"></span></div></div>
    <div class="meta">${meta || "&nbsp;"}</div>
    ${chips ? `<div class="chips">${chips}</div>` : ""}
  </article>`;
}

function render(results, resumeMode) {
  $("results").innerHTML = results.map((j) => card(j, resumeMode)).join("");
  $("legend").hidden = !resumeMode || !results.length;
}

// Search
$("search-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("search-form").querySelector("button.go"); btn.disabled = true; clearResults(); setStatus("Searching...");
  try {
    const params = new URLSearchParams({ q: $("q").value.trim(), k: 15 });
    if ($("loc-search").value.trim()) params.set("location", $("loc-search").value.trim());
    const data = await call(`/search?${params}`);
    render(data.results, false);
    setStatus(data.results.length ? `Top ${data.results.length} jobs for "${data.query}"` : "No jobs found. Try a different location.");
  } catch (err) { setStatus(err.message, true); }
  btn.disabled = false;
});
document.querySelectorAll("[data-ex]").forEach((b) => b.addEventListener("click", () => {
  $("q").value = b.dataset.ex; $("search-form").requestSubmit();
}));

// Resume upload
function pickFile(f) {
  if (!f) return;
  selectedFile = f; $("file-name").textContent = `Selected: ${f.name}`; $("resume-text").value = "";
}
$("file").addEventListener("change", (e) => pickFile(e.target.files[0]));
["dragenter", "dragover"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => pickFile(e.dataTransfer.files[0]));
$("resume-text").addEventListener("input", () => { if ($("resume-text").value) { selectedFile = null; $("file-name").textContent = "or drop it here"; } });

$("match-btn").addEventListener("click", async () => {
  const text = $("resume-text").value.trim();
  if (!selectedFile && text.length < 20) { setStatus("Upload a resume or paste at least a few lines of it.", true); return; }
  const btn = $("match-btn"); btn.disabled = true; clearResults(); setStatus("Reading your resume and matching jobs...");
  const location = $("loc-resume").value.trim() || null;
  try {
    let data;
    if (selectedFile) {
      const form = new FormData();
      form.append("file", selectedFile); form.append("k", "15");
      if (location) form.append("location", location);
      data = await call("/match-file", { method: "POST", body: form });
    } else {
      data = await call("/match", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ resume_text: text, k: 15, location }) });
    }
    $("found").innerHTML = `<b>Skills found in your resume:</b> ${data.resume_skills.length ? data.resume_skills.map((s) => `<span class="chip has">${esc(s)}</span>`).join(" ") : "none recognised"}`;
    $("found").hidden = false;
    render(data.matches, true);
    setStatus(`Top ${data.matches.length} matches, ranked 70% by meaning and 30% by skill overlap`);
  } catch (err) { setStatus(err.message, true); }
  btn.disabled = false;
});

// Footer
call("/health").then((h) => { $("health").textContent = `${h.jobs.toLocaleString()} jobs indexed · ${h.model.split("/").pop()}`; })
  .catch(() => { $("health").textContent = "Index not loaded"; });
</script>
</body>
</html>
